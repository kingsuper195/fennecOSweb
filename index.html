<!DOCTYPE html>
<html style="margin: 0; padding: 0;">

<head>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div id="topbar">
        <p id="welcomeopen">FennecOS</p>
        <p id="time">6/24/2025 2:31 AM</p>
    </div>
    <div id="desktopApps">
        <div id="pocketwatchicon" class="desktopApp">
            <img src="pocketwatch.png" class="icon" />
            <p style="margin:0;">Pocket Watch</p>
        </div>
    </div>
    <!-- https://commons.wikimedia.org/wiki/File:2-Fennec-Foxes-7-18-09-Tad-Motoyama-.-.jpg -->
    <div id="welcome" class="window">
        <div id="welcomeheader" class="header">
            <p style="margin-left: 0.5em;">
                Welcome
            </p>
            <p id="welcomeclose" class="close">X</p>
        </div>
        <h1 style="padding:0.25em">Welcome to FennecOS webEdition v3.14</h1>
        <p style="padding:0.25em">FennecOS webEdition is a mock-up gui version of the true FennecOS that is yet to be
            created.</p>
        <!-- https://commons.wikimedia.org/wiki/File:Fennec_Fox_Peek.jpg -->
        <img id="icon" src="foxes.png" />
    </div>

    <div id="pocketwatch" class="window">
        <div id="pocketwatchheader" class="header">
            <p style="margin-left: 0.5em;">
                PocketWatch
            </p>
            <p id="pocketwatchclose" class="close">X</p>
        </div>
        <h1 style="padding:0.25em">PocketWatch</h1>
    </div>
</body>

</html>
